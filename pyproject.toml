[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot-demo-target"
version = "0.1.0"
description = "Small Python target repository for PatchPilot demonstrations"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
